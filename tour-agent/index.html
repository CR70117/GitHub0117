<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
AI旅游助手
</title>


<link rel="icon" href="data:,">


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">



<!-- 左侧 -->

<aside class="sidebar">


<div class="logo">

🏮 AI旅游助手

</div>



<button id="newChatBtn"
class="new-chat">

＋ 新建对话

</button>





<div class="menu">


<div class="menu-item"
onclick="quickAsk('推荐绍兴热门景点')">

🌏 景点推荐

</div>



<div class="menu-item"
onclick="quickAsk('帮我规划绍兴两日游路线')">

🗺️ 路线规划

</div>




<div class="menu-item"
onclick="quickAsk('推荐绍兴住宿区域和酒店')">

🏨 住宿推荐

</div>




<div class="menu-item"
onclick="quickAsk('介绍绍兴特色美食')">

🍜 美食攻略

</div>




<div class="menu-item"
onclick="quickAsk('分析游客评价和游玩建议')">

📊 游客评价

</div>


</div>



<div class="sidebar-footer">

Powered by AI

</div>


</aside>






<!-- 主区域 -->


<main class="chat-container">



<header class="chat-header">


<h2>

AI旅游规划助手

</h2>


<span>

● 在线

</span>


</header>






<section id="chatBox"
class="chat-box">



<div class="message ai">


<div class="avatar">
AI
</div>


<div class="bubble">


你好，我是你的 AI旅游规划助手 👋

<br><br>

我可以帮助你：

<br>
🌏 推荐绍兴景点

<br>
🗺️ 制定旅游路线

<br>
🏨 推荐住宿

<br>
🍜 推荐美食

<br>
📊 分析游客评价


</div>


</div>


</section>






<footer class="input-area">


<textarea

id="prompt"

placeholder="输入你的旅游需求，例如：帮我规划绍兴三日游..."

></textarea>



<button id="sendBtn">

发送

</button>


</footer>



</main>


</div>



<script src="./script.js"></script>


</body>


</html>
